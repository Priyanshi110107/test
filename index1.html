<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Webpage</title>
    <style>
        nav{
            background-color: aqua;
            font-size: 30px;
            text-align: center;
            padding: 20px;
            margin: 20px;
        }
        nav a{
            color: black;
            padding: 15px ;
            margin:10px ;
        }
        nav a:hover{
            text-decoration-color: red;
           color: blue;
           background-image: linear-gradient();
           background-position: 10px;
           border-bottom-color: red ;

        }
    </style>
</head>
<body>
    <nav>
        <a href="#">About</a>
        <a href="#">Home</a>
        <a href="#">Contact</a>
        <a href="#">Services</a>
    </nav>
</body>
</html>
