<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #page{
            height: 100vh;
            width: 100%;
            text-align: start;
        }
        #page #nav{
            height: 100px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        #nav #navleft{
            display: flex;
            height: 100%;
            width: 20%;
            gap: 10%;
        }
        #nav #navcenter{
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;

        }
        #navright{
            align-items: center;
            display: flex;
            gap: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        #navright h1{
            font-size: 30px;

        }
        #navright button{
            padding: 10px 20px;
            background-color: black;
            color: white;
            border-radius: 50px;
            border: none;
            display: flex;
            gap: 20px;
        }
        #center {
            height: 50px;
            width: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            padding: 80px; 
            justify-content: flex-start;
            flex-direction: column;
            
        }
        #center h1{
            font-size: 30px;
            font-weight: 600;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        #center p{
            font-size: 60px;
            margin-top: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        #center h2{
            font-size: 18px;
            color: rgb(96, 86, 86);
            margin-top: 0px;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        #center button{
            padding: 10px 20px;
            background-color: black;
            color: white;
            border-radius: 50px;
            border: none;
        }
        #page #bottom{
            padding: 30%;
            height: 50px;
            width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* background-image: url(https://plus.unsplash.com/premium_photo-1789652751182-f4af07e03ee3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8); */
            background-repeat: no-repeat;
            background-size: cover; 
            margin-top: 30px;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div id="page">
        <div id="nav">
            <div id="navleft">
                <h1>Twinkle.ai</h1>
            </div>
            <div id="navcenter">
                <h1>Products</h1>
                <h1>Use Cases</h1>
                <h1>Company</h1>
                <h1>Resources</h1>
            </div>
            <div id="navright">
                <h1>Login</h1>
                <button>Get Started Free</button>
            </div>
        </div>
        <div id="center">
            <h1>5.0 over 24.5k + Reviews</h1>
            <p>Do More. Stress Less. <br>Let AI Handle It.</p>
            <h2>Our AI connects with your favorite tools to help you write, <br> organize,and work faster everywhere</h2>
            <button>Start Free Trial</button>
            <div id="bottom">
                <!-- <img src="https://plus.unsplash.com/premium_photo-1789652751182-f4af07e03ee3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8" alt=""> -->
            </div>
        </div>
    </div>
</body>
</html>
